name: Build PrepFlow Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: JDK 17 Kur (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK Ortamını Hazırla
        uses: android-actions/setup-android@v3

      - name: Android SDK Lisanslarını Onayla
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Gradle 8.9 Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Debug APK Derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Üretilen APK Dosyasını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: PrepFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
